<!doctype html>
<!-- @dsCard group="UI Kit — Mobile App" name="Mobile app UI kit" subtitle="5-screen click-thru: splash, sign-in, home, allo Grow, transfer, profile" viewport="1180x900" -->
<html lang="id">
<head>
<meta charset="utf-8">
<title>Allo Bank — Mobile App UI Kit</title>
<link rel="stylesheet" href="../../colors_and_type.css">
<style>
  body {
    margin: 0; min-height: 100vh; background: #FAFAFA;
    font-family: 'Inter', sans-serif; color: #333;
    display: flex; flex-direction: column; align-items: center;
    padding: 32px 24px 64px;
  }
  .header { width: 100%; max-width: 1180px; margin-bottom: 24px; }
  .header h1 { font-family: 'Satoshi', sans-serif; font-weight: 900; font-size: 36px; letter-spacing: -0.025em; margin: 0 0 4px 0; }
  .header .a { color: #FFAF03; }
  .header .sub { color: #5C5C5C; font-size: 14px; }
  .stage { display: flex; gap: 28px; flex-wrap: wrap; justify-content: center; }
  .phone {
    width: 360px; height: 760px; background: #1A1A1A; border-radius: 48px;
    padding: 12px; box-shadow: 0 24px 60px rgba(0,0,0,0.18), 0 8px 16px rgba(0,0,0,0.08);
    position: relative; flex-shrink: 0;
  }
  .phone::before {
    content: ''; position: absolute; top: 18px; left: 50%; transform: translateX(-50%);
    width: 110px; height: 28px; background: #1A1A1A; border-radius: 999px; z-index: 10;
  }
  .screen {
    width: 100%; height: 100%; background: #fff; border-radius: 38px; overflow: hidden;
    display: flex; flex-direction: column; position: relative;
  }
  .label {
    text-align: center; margin-top: 12px;
    font-family: 'Inter', sans-serif; font-size: 13px; font-weight: 500; color: #5C5C5C;
  }
  .phone-wrap { display: flex; flex-direction: column; align-items: center; }
  @keyframes alloFade { from { opacity: 0; } to { opacity: 1; } }
  @keyframes alloSlideUp { from { transform: translateY(24px); } to { transform: translateY(0); } }
  /* hide WebKit scrollbars in screens */
  .screen ::-webkit-scrollbar { display: none; }
</style>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>
<body>
  <div class="header">
    <h1><span class="a">allo</span>bank — mobile app UI kit</h1>
    <div class="sub">Click any phone to interact. Five-screen flow: splash → sign in → home → product detail → transfer → profile.</div>
  </div>
  <div id="root" class="stage"></div>

  <script type="text/babel" src="Icon.jsx"></script>
  <script type="text/babel" src="Atoms.jsx"></script>
  <script type="text/babel" src="Cards.jsx"></script>
  <script type="text/babel" src="Screens.jsx"></script>

  <script type="text/babel">
    const { useState } = React;

    function Phone({ initialScreen = 'splash', label }) {
      const [screen, setScreen] = useState(initialScreen);
      const [tab, setTab] = useState('home');
      const [sheet, setSheet] = useState(null);

      const showHome = ['home', 'history', 'card', 'me'].includes(screen);
      const dark = screen === 'splash';

      let body;
      if (screen === 'splash') body = <ScreenSplash onContinue={() => setScreen('signin')}/>;
      else if (screen === 'signin') body = <ScreenSignIn onSignIn={() => setScreen('home')} onBack={() => setScreen('splash')}/>;
      else if (screen === 'home') body = (
        <ScreenHome
          onProduct={(p) => { if (p === 'grow') setScreen('grow'); else setSheet(p); }}
          onTransfer={() => setScreen('transfer')}
        />
      );
      else if (screen === 'grow') body = <ScreenGrow onBack={() => setScreen('home')}/>;
      else if (screen === 'transfer') body = <ScreenTransfer onBack={() => setScreen('home')} onSent={() => { setSheet('sent'); }}/>;
      else if (screen === 'me') body = <ScreenProfile onBack={() => setScreen('home')}/>;
      else body = <ScreenHome onProduct={() => {}} onTransfer={() => setScreen('transfer')}/>;

      return (
        <div className="phone-wrap">
          <div className="phone">
            <div className="screen">
              <StatusBar dark={dark || screen === 'home' || screen === 'me'} />
              {body}
              {showHome && (
                <BottomNav tab={tab} onTab={(t) => {
                  setTab(t);
                  if (t === 'me') setScreen('me');
                  else if (t === 'home') setScreen('home');
                }} />
              )}
              {sheet && sheet !== 'sent' && (
                <Sheet open onClose={() => setSheet(null)} title={`allo ${sheet}`}>
                  <div style={{ padding: '8px 0 16px', color: '#5C5C5C', fontSize: 14, lineHeight: 1.5 }}>
                    Demo placeholder — this product screen is not built out yet. Tap "allo Grow" on the home grid to see a fully-built product detail.
                  </div>
                  <Button variant="primary" size="md" full onClick={() => setSheet(null)}>Tutup</Button>
                </Sheet>
              )}
              {sheet === 'sent' && (
                <Sheet open onClose={() => { setSheet(null); setScreen('home'); }} title="">
                  <div style={{ textAlign: 'center', padding: '12px 0 4px' }}>
                    <div style={{
                      width: 72, height: 72, borderRadius: 999, background: '#E6F6EC',
                      display: 'inline-flex', alignItems: 'center', justifyContent: 'center', marginBottom: 14,
                    }}>
                      <Icon name="check" size={36} color="#1F9D55" stroke={2.4}/>
                    </div>
                    <div style={{
                      fontFamily: "'Satoshi', sans-serif", fontWeight: 900, fontSize: 22,
                      letterSpacing: '-0.02em', color: '#333', marginBottom: 6,
                    }}>Transfer berhasil!</div>
                    <div style={{ fontSize: 13, color: '#5C5C5C', marginBottom: 18 }}>Rp 250.000 telah dikirim ke Budi Cahyono.</div>
                    <Button variant="primary" size="md" full onClick={() => { setSheet(null); setScreen('home'); }}>Selesai</Button>
                  </div>
                </Sheet>
              )}
            </div>
          </div>
          <div className="label">{label}</div>
        </div>
      );
    }

    function App() {
      return (
        <>
          <Phone initialScreen="splash" label="1. Splash · sign in" />
          <Phone initialScreen="home"   label="2. Home / Beranda" />
          <Phone initialScreen="grow"   label="3. allo Grow detail" />
          <Phone initialScreen="transfer" label="4. Transfer" />
          <Phone initialScreen="me"     label="5. Profil / Akun" />
        </>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
