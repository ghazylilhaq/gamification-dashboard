<html><head>
<meta charset="utf-8">
<title>Iconography (Lucide stand-in)</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin: 0; padding: 24px; background: #fff; font-family: var(--font-ui); }
  .grid { display: grid; grid-template-columns: repeat(8, 1fr); gap: 12px; }
  .item { display: flex; flex-direction: column; align-items: center; gap: 6px; }
  .ic { width: 48px; height: 48px; border-radius: 14px; background: #FAFAFA; display: flex; align-items: center; justify-content: center; color: #333; }
  .ic.fill { background: #FFAF03; }
  .ic.duo  { background: #FFE39B; }
  .name { font-size: 10px; color: var(--fg-4); }
  svg { width: 22px; height: 22px; stroke: currentColor; stroke-width: 1.75; fill: none; stroke-linecap: round; stroke-linejoin: round; }
</style>
</head><body>
  <div class="grid">
    <div class="item"><div class="ic"><svg viewBox="0 0 24 24"><path d="M3 7h18M3 12h18M3 17h12"/></svg></div><div class="name">menu</div></div>
    <div class="item"><div class="ic"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4-4"/></svg></div><div class="name">search</div></div>
    <div class="item"><div class="ic"><svg viewBox="0 0 24 24"><rect x="3" y="6" width="18" height="13" rx="2"/><path d="M3 10h18"/></svg></div><div class="name">card</div></div>
    <div class="item"><div class="ic"><svg viewBox="0 0 24 24"><path d="M3 21V8l9-5 9 5v13"/><path d="M9 21v-7h6v7"/></svg></div><div class="name">home</div></div>
    <div class="item"><div class="ic duo"><svg viewBox="0 0 24 24"><path d="M12 2v20M5 9l7-7 7 7"/></svg></div><div class="name">send</div></div>
    <div class="item"><div class="ic duo"><svg viewBox="0 0 24 24"><path d="M21 12c0 5-4 9-9 9s-9-4-9-9 4-9 9-9c2.5 0 4.7 1 6.4 2.6"/><path d="M21 5v5h-5"/></svg></div><div class="name">refresh</div></div>
    <div class="item"><div class="ic fill"><svg viewBox="0 0 24 24"><path d="M20 12V7a2 2 0 00-2-2H6a2 2 0 00-2 2v10a2 2 0 002 2h12a2 2 0 002-2v-1"/><path d="M14 12h7"/></svg></div><div class="name">wallet</div></div>
