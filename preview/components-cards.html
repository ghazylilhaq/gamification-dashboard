<!doctype html>
<!-- @dsCard group="Brand" name="Cards" subtitle="White / yellow / dark surfaces" viewport="700x180" -->
<html><head>
<meta charset="utf-8">
<title>Cards</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin: 0; padding: 24px; background: #FAFAFA; font-family: var(--font-ui); }
  .grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 14px; }
  .card { border-radius: 20px; padding: 18px; box-shadow: 0 6px 18px rgba(51,51,51,0.06); }
  .a { background: #fff; }
  .b { background: #FFAF03; color: #333; }
  .c { background: #333; color: #fff; }
  .eyebrow { font-size: 10px; font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase; opacity: 0.7; margin-bottom: 6px; }
  .title { font-family: var(--font-display); font-size: 22px; font-weight: 700; letter-spacing: -0.02em; line-height: 1.1; margin-bottom: 4px; }
  .body { font-size: 12px; opacity: 0.75; line-height: 1.4; }
  .num { font-family: var(--font-display); font-size: 28px; font-weight: 900; letter-spacing: -0.03em; }
</style>
</head><body>
  <div class="grid">
    <div class="card a">
      <div class="eyebrow">Saldo aktif</div>
      <div class="num">Rp 4.250.000</div>
      <div class="body">+ Rp 120.000 minggu ini</div>
    </div>
    <div class="card b">
      <div class="eyebrow">allo Grow</div>
      <div class="title">Liburan Bali 🌴</div>
      <div class="body">62% tercapai · Rp 3.1 jt / 5 jt</div>
    </div>
    <div class="card c">
      <div class="eyebrow">allo PayLater</div>
      <div class="title">Cicilan bulan ini</div>
      <div class="body">Jatuh tempo 25 Mei · Rp 540.000</div>
    </div>
  </div>
</body></html>
