<!doctype html>
<!-- @dsCard group="Brand" name="Secondary product accents" subtitle="Orange, Magenta, Purple, Teal, Cyan — one per sub-product" viewport="700x200" -->
<html><head>
<meta charset="utf-8">
<title>Colors — Secondary (Product accents)</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin: 0; padding: 24px; background: var(--bg-2); }
  .grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px; }
  .swatch { border-radius: var(--radius-md); padding: 14px; height: 110px; display: flex; flex-direction: column; justify-content: space-between; box-shadow: var(--shadow-1); }
  .name { font-family: var(--font-display); font-weight: 700; font-size: 13px; letter-spacing: -0.01em; line-height: 1.15; }
  .hex { font-family: var(--font-mono); font-size: 11px; opacity: 0.8; }
  .product { font-size: 10px; opacity: 0.7; font-family: var(--font-ui); margin-top: 4px; }
</style>
</head><body>
  <div class="grid">
    <div class="swatch" style="background:#F38000; color:#fff;">
      <div><div class="name">Allo Orange</div><div class="product">Pay+, warnings</div></div>
      <div class="hex">#F38000</div>
    </div>
    <div class="swatch" style="background:#E947A5; color:#fff;">
      <div><div class="name">Magenta</div><div class="product">PayLater</div></div>
      <div class="hex">#E947A5</div>
    </div>
    <div class="swatch" style="background:#B1B5FF; color:#333;">
      <div><div class="name">Soft Purple</div><div class="product">Activities, Bisnis</div></div>
      <div class="hex">#B1B5FF</div>
    </div>
    <div class="swatch" style="background:#4597A8; color:#fff;">
      <div><div class="name">Teal</div><div class="product">Grow, Deposito</div></div>
      <div class="hex">#4597A8</div>
    </div>
    <div class="swatch" style="background:#B1EFCE; color:#333;">
      <div><div class="name">Cyan Mint</div><div class="product">Explore</div></div>
      <div class="hex">#B1EFCE</div>
    </div>
  </div>
</body></html>
