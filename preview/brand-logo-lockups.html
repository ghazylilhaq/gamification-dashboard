<!doctype html>
<!-- @dsCard group="Brand" name="Logo on background variants" subtitle="White, yellow, dark surfaces" viewport="700x220" -->
<html><head>
<meta charset="utf-8">
<title>Brand — Logo lockups</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin: 0; padding: 0; display: grid; grid-template-columns: 1fr 1fr 1fr; min-height: 220px; font-family: var(--font-display); font-weight: 900; font-size: 48px; letter-spacing: -0.04em; }
  .cell { display: flex; align-items: center; justify-content: center; }
  .cell.white { background: #fff; }
  .cell.yellow { background: #FFAF03; }
  .cell.dark   { background: #333; }
  .a { color: #FFAF03; } .b { color: #333; }
  .yellow .a { color: #fff; } .yellow .b { color: #333; }
  .dark .a { color: #FFAF03; } .dark .b { color: #fff; }
</style>
</head><body>
  <div class="cell white"><span><span class="a">allo</span><span class="b">bank</span></span></div>
  <div class="cell yellow"><span><span class="a">allo</span><span class="b">bank</span></span></div>
  <div class="cell dark"><span><span class="a">allo</span><span class="b">bank</span></span></div>
</body></html>
