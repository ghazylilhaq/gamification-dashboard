<!doctype html>
<!-- @dsCard group="Brand" name="Spacing scale" subtitle="4-pixel base, sp-1 → sp-16" viewport="700x260" -->
<html><head>
<meta charset="utf-8">
<title>Spacing — 4-base scale</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin: 0; padding: 24px; background: var(--bg-2); font-family: var(--font-ui); }
  .row { display: flex; align-items: center; gap: 12px; padding: 4px 0; font-size: 12px; color: var(--fg-3); }
  .label { font-family: var(--font-mono); width: 60px; flex-shrink: 0; color: var(--fg-2); }
  .bar { background: #FFAF03; height: 12px; border-radius: 4px; }
  .px { font-family: var(--font-mono); color: var(--fg-4); }
</style>
</head><body>
  <div class="row"><span class="label">sp-1</span><div class="bar" style="width:4px"></div><span class="px">4</span></div>
  <div class="row"><span class="label">sp-2</span><div class="bar" style="width:8px"></div><span class="px">8</span></div>
  <div class="row"><span class="label">sp-3</span><div class="bar" style="width:12px"></div><span class="px">12</span></div>
  <div class="row"><span class="label">sp-4</span><div class="bar" style="width:16px"></div><span class="px">16</span></div>
  <div class="row"><span class="label">sp-6</span><div class="bar" style="width:24px"></div><span class="px">24</span></div>
  <div class="row"><span class="label">sp-8</span><div class="bar" style="width:32px"></div><span class="px">32</span></div>
  <div class="row"><span class="label">sp-12</span><div class="bar" style="width:48px"></div><span class="px">48</span></div>
  <div class="row"><span class="label">sp-16</span><div class="bar" style="width:64px"></div><span class="px">64</span></div>
</body></html>
