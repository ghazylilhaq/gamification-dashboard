<!doctype html>
<!-- @dsCard group="Brand" name="Brand · Product wordmarks" subtitle="All 9 product logos using official PNGs" viewport="720x700" -->
<html><head>
<meta charset="utf-8">
<title>Brand — Product wordmarks</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin: 0; padding: 24px; background: var(--bg-2); font-family: var(--font-ui); }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .mark {
    background: #fff;
    border-radius: var(--radius-lg);
    padding: 28px 32px;
    box-shadow: var(--shadow-1);
    display: flex; align-items: center; justify-content: flex-start;
    min-height: 88px;
    position: relative;
  }
  .mark img { max-height: 44px; max-width: 90%; object-fit: contain; display: block; }
  .name {
    position: absolute; bottom: 10px; right: 14px;
    font-size: 11px; font-weight: 600; letter-spacing: 0.04em;
    color: var(--ink-4);
  }
</style>
</head><body>
  <div class="grid">
    <div class="mark"><img src="../assets/products/pay/02.png" alt="allo Pay"><span class="name">allo Pay</span></div>
    <div class="mark"><img src="../assets/products/pay-plus/02.png" alt="allo Pay+"><span class="name">allo Pay+</span></div>
    <div class="mark"><img src="../assets/products/prime/02.png" alt="allo Prime"><span class="name">allo Prime</span></div>
    <div class="mark"><img src="../assets/products/grow/02.png" alt="allo Grow"><span class="name">allo Grow</span></div>
    <div class="mark"><img src="../assets/products/deposito/02.png" alt="allo Deposito"><span class="name">allo Deposito</span></div>
    <div class="mark"><img src="../assets/products/paylater/02.png" alt="allo PayLater"><span class="name">allo PayLater</span></div>
    <div class="mark"><img src="../assets/products/instant-cash/02.png" alt="allo InstantCash"><span class="name">allo InstantCash</span></div>
    <div class="mark"><img src="../assets/products/explore/02.png" alt="allo Explore"><span class="name">allo Explore</span></div>
    <div class="mark"><img src="../assets/products/bisnis/02.png" alt="allo Bisnis"><span class="name">allo Bisnis</span></div>
  </div>
</body></html>
