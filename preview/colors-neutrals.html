<!doctype html>
<!-- @dsCard group="Brand" name="Neutral scale" subtitle="Ink 1–5 + lines + surfaces" viewport="700x180" -->
<html><head>
<meta charset="utf-8">
<title>Colors — Neutrals</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin: 0; padding: 24px; background: var(--bg-2); }
  .row { display: grid; grid-template-columns: repeat(8, 1fr); gap: 6px; }
  .swatch { aspect-ratio: 1; border-radius: var(--radius-sm); display: flex; align-items: flex-end; padding: 8px; font-family: var(--font-mono); font-size: 10px; }
  .label { display: block; font-family: var(--font-ui); font-weight: 600; font-size: 11px; margin-bottom: 4px; }
</style>
</head><body>
  <div class="row">
    <div><span class="label">ink-1</span><div class="swatch" style="background:#1A1A1A; color:#fff;">1A</div></div>
    <div><span class="label">ink-2</span><div class="swatch" style="background:#333; color:#fff;">33</div></div>
    <div><span class="label">ink-3</span><div class="swatch" style="background:#5C5C5C; color:#fff;">5C</div></div>
    <div><span class="label">ink-4</span><div class="swatch" style="background:#8A8A8A; color:#fff;">8A</div></div>
    <div><span class="label">ink-5</span><div class="swatch" style="background:#B8B8B8; color:#333;">B8</div></div>
    <div><span class="label">line-1</span><div class="swatch" style="background:#E6E6E6; color:#333;">E6</div></div>
    <div><span class="label">surface-2</span><div class="swatch" style="background:#FAFAFA; color:#333; border:1px solid #eee;">FA</div></div>
    <div><span class="label">white</span><div class="swatch" style="background:#fff; color:#333; border:1px solid #eee;">FF</div></div>
  </div>
</body></html>
