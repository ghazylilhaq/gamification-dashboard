<!doctype html>
<!-- @dsCard group="Brand" name="Corner radii" subtitle="xs → pill, generous rounding" viewport="700x160" -->
<html><head>
<meta charset="utf-8">
<title>Radii</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin: 0; padding: 24px; background: var(--bg-2); font-family: var(--font-ui); }
  .row { display: flex; gap: 16px; align-items: flex-end; }
  .item { display: flex; flex-direction: column; align-items: center; gap: 6px; }
  .box { width: 72px; height: 72px; background: #FFAF03; }
  .name { font-size: 11px; font-family: var(--font-mono); color: var(--fg-3); }
  .px { font-size: 11px; color: var(--fg-4); }
</style>
</head><body>
  <div class="row">
    <div class="item"><div class="box" style="border-radius:6px"></div><div class="name">xs</div><div class="px">6</div></div>
    <div class="item"><div class="box" style="border-radius:10px"></div><div class="name">sm</div><div class="px">10</div></div>
    <div class="item"><div class="box" style="border-radius:16px"></div><div class="name">md</div><div class="px">16</div></div>
    <div class="item"><div class="box" style="border-radius:24px"></div><div class="name">lg</div><div class="px">24</div></div>
    <div class="item"><div class="box" style="border-radius:32px"></div><div class="name">xl</div><div class="px">32</div></div>
    <div class="item"><div class="box" style="border-radius:999px"></div><div class="name">pill</div><div class="px">999</div></div>
  </div>
</body></html>
