<!doctype html>
<!-- @dsCard group="Brand" name="Semantic colors" subtitle="Success, Warning, Danger, Info" viewport="700x130" -->
<html><head>
<meta charset="utf-8">
<title>Colors — Semantic</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin: 0; padding: 24px; background: var(--bg-2); }
  .grid { display: grid; grid-template-columns: 1fr 1fr 1fr 1fr; gap: 10px; }
  .pill { padding: 12px; border-radius: var(--radius-md); font-family: var(--font-ui); font-weight: 600; font-size: 14px; display: flex; flex-direction: column; gap: 4px; }
  .hex { font-family: var(--font-mono); font-size: 11px; font-weight: 400; opacity: 0.75; }
</style>
</head><body>
  <div class="grid">
    <div class="pill" style="background:#E6F6EC; color:#1F9D55;">Success<span class="hex">#1F9D55</span></div>
    <div class="pill" style="background:#FFEDD5; color:#F38000;">Warning<span class="hex">#F38000</span></div>
    <div class="pill" style="background:#FCE8E8; color:#D14343;">Danger<span class="hex">#D14343</span></div>
    <div class="pill" style="background:#E8F0FE; color:#2F6FED;">Info<span class="hex">#2F6FED</span></div>
  </div>
</body></html>
