<!doctype html>
<!-- @dsCard group="Brand" name="Shadow / elevation" subtitle="Soft, warm-tinted; yellow CTA shadow" viewport="700x180" -->
<html><head>
<meta charset="utf-8">
<title>Shadows / Elevation</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin: 0; padding: 32px 24px; background: #fff; font-family: var(--font-ui); }
  .row { display: grid; grid-template-columns: 1fr 1fr 1fr 1fr; gap: 20px; }
  .item { display: flex; flex-direction: column; align-items: center; gap: 12px; }
  .box { width: 100%; height: 80px; background: #fff; border-radius: 16px; }
  .s1 { box-shadow: 0 1px 2px rgba(51,51,51,0.06), 0 1px 1px rgba(51,51,51,0.04); }
  .s2 { box-shadow: 0 6px 18px rgba(51,51,51,0.08), 0 2px 4px rgba(51,51,51,0.04); }
  .s3 { box-shadow: 0 18px 48px rgba(51,51,51,0.12), 0 4px 12px rgba(51,51,51,0.06); }
  .sy { box-shadow: 0 12px 28px rgba(255,175,3,0.35); }
  .name { font-size: 12px; color: var(--fg-3); font-family: var(--font-mono); }
</style>
</head><body>
  <div class="row">
    <div class="item"><div class="box s1"></div><div class="name">shadow-1</div></div>
    <div class="item"><div class="box s2"></div><div class="name">shadow-2</div></div>
    <div class="item"><div class="box s3"></div><div class="name">shadow-3</div></div>
    <div class="item"><div class="box sy" style="background:#FFAF03"></div><div class="name">shadow-yellow</div></div>
  </div>
</body></html>
